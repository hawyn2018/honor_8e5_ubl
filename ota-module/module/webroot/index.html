<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6f8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>hnubl · OTA 设置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 7 3v5c0 4-2.5 7.4-7 10-4.5-2.6-7-6-7-10V6l7-3Z"/><path d="m13 7-4 6h5l-3 5"/></svg></span><span>hnubl OTA</span><span class="version">3.0.0</span></div>
      <h1>更新，按你的方式</h1>
      <p class="hero-note">选择全量包策略，让每次更新都符合预期。</p>
    </header>

    <section class="status-card" aria-labelledby="statusHeading">
      <div class="status-symbol" id="statusSymbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="status-copy"><h2 id="statusHeading">当前生效</h2><p class="active-mode" id="activeMode">正在读取设置</p><p class="state-note" id="stateNote">请稍候…</p></div>
      <span class="state-tag" id="stateTag">读取中</span>
    </section>

    <section class="settings-section" aria-labelledby="strategyHeading">
      <div class="section-heading"><h2 id="strategyHeading">全量包策略</h2><span>01</span></div>
      <div class="setting-card">
        <label class="switch-row" for="forceFullPackage">
          <span class="switch-label"><strong>始终获取全量包</strong><span>包括当前已安装的版本</span></span>
          <span class="switch"><input id="forceFullPackage" type="checkbox" role="switch" aria-describedby="modeDescription" disabled><span class="switch-track" aria-hidden="true"><span class="switch-thumb"><svg viewBox="0 0 16 16"><path d="m4 8 3 3 5-6"/></svg></span></span></span>
        </label>
        <p class="setting-description" id="modeDescription">关闭时按版本判断更新，同版或较旧版本显示为最新。</p>
      </div>
      <p class="save-note" id="saveNote">设置会保存到模块中，下次手机启动时生效。</p>
    </section>

    <section class="apply-section" aria-labelledby="applyHeading">
      <div class="section-heading"><h2 id="applyHeading">应用设置</h2><span>02</span></div>
      <button class="apply-button" id="applyButton" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 11.5-1L20 9M4 15l2.5 3A7 7 0 0 0 18 17"/></svg><span id="applyLabel">立即应用</span></button>
      <p class="apply-description">软件更新正在运行时，仅重启该应用；未运行时保持关闭，下次手动打开时生效。不重启手机。</p>
    </section>

    <section class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="feedback-dot" aria-hidden="true"></span><div><p id="feedbackMessage"></p><details id="errorDetails" hidden><summary>查看详细信息</summary><pre id="errorText"></pre></details><button class="retry-button" id="refreshButton" type="button" hidden>重新读取状态</button></div>
    </section>

    <aside class="rules" aria-label="关闭开关时的版本判断规则">
      <span class="rules-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg></span>
      <p>关闭开关后，先比较数字版本号；数字版本相同时，再检查括号内信息是否有变化。</p>
    </aside>
    <footer>hnubl · 让更新保持自由</footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
